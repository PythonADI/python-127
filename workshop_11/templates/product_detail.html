{% extends "base.html" %}


{% block title %}{{ product.name }}{% endblock  %}


{% block content %}
    <h1>{{ product.name }}</h1>

    <p>Price: {{ product.price }} Lari</p>
    <p>Production date: {{ product.production_date }}</p>
    <p>Expiry date: {{ product.expiry_date }}</p>
    <p>{{ product.description }}</p>
{% endblock  %}
