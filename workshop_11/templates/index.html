{% extends "base.html" %}
{% block title %}Portal{% endblock  %}

{% block content %}
    <h1>My first web app</h1>

    <ul>
        {% for product in products %}
            <li>
                <a
                    href="{% url 'product_detail' product.id %}"
                >
                    {{ product.name }}
                </a>
                - {{ product.price }} Lari
            </li>
        {% endfor %}
    </ul>
{% endblock  %}
