{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        {% endblock %}
    </title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'style.css' %}">

    {% block styles %}

    {% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-md site-nav sticky-top">
        <div class="container">
            <a class="navbar-brand brand" href="{% url 'home' %}">Menu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto gap-md-1">
                    <li class="nav-item"><a class="nav-link" href="{% url 'about-us' %}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'test' %}">Blog</a></li>
                </ul>
                <form class="d-flex ms-md-3 mt-2 mt-md-0" role="search">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search products..." aria-label="Search" 
                    value="{{ request.GET.q }}">
                    <button class="btn btn-accent" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <main>
    {% block content %}{% endblock %}
    </main>

    <footer>&copy; {% now "Y" %} Bakery &middot; Baked fresh daily</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
